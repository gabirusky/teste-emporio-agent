[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-da-musica-ai-agent"
version = "0.1.0"
description = "AI customer service agent for Empório da Música"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "pandas>=2.2.0",
  "python-dotenv>=1.0.0",
  "PyMuPDF>=1.24.0",
  "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
